// ── Cursor ──────────────────────────────────────────────────────────────────
function startCursor() {
  const d=document.getElementById('c1'),r=document.getElementById('c2');
  if(!d||!r)return;
  let mx=-99,my=-99,rx=-99,ry=-99;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  const t=()=>{ d.style.left=mx+'px';d.style.top=my+'px';rx+=(mx-rx)*.11;ry+=(my-ry)*.11;r.style.left=rx+'px';r.style.top=ry+'px';requestAnimationFrame(t); };
  t();
  document.querySelectorAll('a,button,input,textarea').forEach(el=>{
    el.addEventListener('mouseenter',()=>{r.style.width='56px';r.style.height='56px';r.style.opacity='.5';d.style.opacity='0';});
    el.addEventListener('mouseleave',()=>{r.style.width='38px';r.style.height='38px';r.style.opacity='.25';d.style.opacity='1';});
  });
}

function useReveal() {
  useEffect(()=>{
    const els=document.querySelectorAll('.reveal');
    const obs=new IntersectionObserver(entries=>entries.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);} }),{threshold:.1});
    els.forEach(el=>obs.observe(el));
    return()=>obs.disconnect();
  });
}

function Contact({ t, ac }) {
  const f = t.contact.form;
  const [fields, setFields] = useState({ name:'', email:'', project:'' });
  const [status, setStatus] = useState('idle');

  const submit = async e => {
    e.preventDefault();
    setStatus('sending');
    try {
      const res = await fetch(FORMSPREE, { method:'POST', headers:{ 'Content-Type':'application/json', Accept:'application/json' }, body:JSON.stringify({ name:fields.name, email:fields.email, message:fields.project }) });
      setStatus(res.ok ? 'sent' : 'sent');
    } catch {
      window.location.href = `mailto:${EMAIL}?subject=Proyecto de ${encodeURIComponent(fields.name)}&body=${encodeURIComponent(fields.project)}`;
      setStatus('sent');
    }
  };

  return (
    <section id="contact" style={{ padding:'120px 48px' }}>
      <div style={{ maxWidth:1140,margin:'0 auto' }}>
        <div style={{ display:'grid',gridTemplateColumns:'1fr 1.1fr',gap:80,alignItems:'flex-start' }}>
          {/* Left */}
          <div className="reveal">
            <SectionTag ac={ac}>{t.contact.tag}</SectionTag>
            <h2 style={{ fontSize:'clamp(36px,5vw,60px)',fontWeight:800,letterSpacing:'-.04em',lineHeight:1.06,marginBottom:20,whiteSpace:'pre-line' }}>{t.contact.h}</h2>
            <p style={{ fontSize:16,color:'#666',lineHeight:1.72,marginBottom:36,maxWidth:380,textWrap:'pretty' }}>{t.contact.sub}</p>

            <a href={CALENDLY} target="_blank"
              style={{ display:'inline-flex',alignItems:'center',gap:10,fontSize:15,fontWeight:700,color:'#0c0c10',background:ac,padding:'15px 32px',borderRadius:100,marginBottom:16,transition:'transform .25s,box-shadow .25s',boxShadow:`0 0 40px ${ac}25` }}
              onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow=`0 10px 48px ${ac}50`;}}
              onMouseLeave={e=>{e.currentTarget.style.transform='none';e.currentTarget.style.boxShadow=`0 0 40px ${ac}25`;}}>
              {t.contact.cta}
            </a>
            <div style={{ display:'flex',alignItems:'center',gap:8,fontSize:12,color:'#333',marginBottom:48 }}>
              <Dot ac={ac}/>{t.contact.avail}
            </div>


          </div>

          {/* Right — form */}
          <div className="reveal d2">
            {status === 'sent' ? (
              <div className="card" style={{ borderRadius:24,padding:'56px 40px',textAlign:'center' }}>
                <div style={{ width:56,height:56,borderRadius:'50%',background:`${ac}15`,border:`1px solid ${ac}30`,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px',fontSize:22,color:ac }}>✓</div>
                <h3 style={{ fontSize:22,fontWeight:700,marginBottom:10 }}>{f.ok}</h3>
              </div>
            ) : (
              <form onSubmit={submit} style={{ display:'flex',flexDirection:'column',gap:14 }}>
                <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:14 }}>
                  <input required className="inp" placeholder={f.name} value={fields.name} onChange={e=>setFields(p=>({...p,name:e.target.value}))} style={{ '--ac':ac }} onFocus={e=>e.target.style.borderColor=ac} onBlur={e=>e.target.style.borderColor='#252530'}/>
                  <input required type="email" className="inp" placeholder={f.email} value={fields.email} onChange={e=>setFields(p=>({...p,email:e.target.value}))} onFocus={e=>e.target.style.borderColor=ac} onBlur={e=>e.target.style.borderColor='#252530'}/>
                </div>
                <textarea required rows={6} className="inp" placeholder={f.project} value={fields.project} onChange={e=>setFields(p=>({...p,project:e.target.value}))} style={{ resize:'vertical',minHeight:140 }} onFocus={e=>e.target.style.borderColor=ac} onBlur={e=>e.target.style.borderColor='#252530'}/>
                <div style={{ display:'flex',justifyContent:'flex-end' }}>
                  <button type="submit" disabled={status==='sending'}
                    style={{ background:ac,color:'#0c0c10',fontWeight:700,fontSize:15,padding:'14px 32px',borderRadius:100,transition:'transform .25s,box-shadow .25s,opacity .2s',boxShadow:`0 0 24px ${ac}20`,opacity:status==='sending'?.6:1 }}
                    onMouseEnter={e=>{ if(status!=='sending'){e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.boxShadow=`0 8px 36px ${ac}45`;}}}
                    onMouseLeave={e=>{e.currentTarget.style.transform='none';e.currentTarget.style.boxShadow=`0 0 24px ${ac}20`;}}>
                    {status==='sending'?'...' : f.send}
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

// ── Footer ────────────────────────────────────────────────────────────────────
function Footer({ t, ac }) {
  return (
    <footer style={{ background:'#0c0c10', borderTop:'1px solid #1a1a22', overflow:'hidden', paddingBottom:0 }}>
      {/* Minimal top row: copyright + links */}
      <div style={{ padding:'28px 48px 20px', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:12 }}>
        <p style={{ fontSize:11,color:'#252530',letterSpacing:'.04em' }}>{t.footer.copy}</p>
        <div style={{ display:'flex', gap:20 }}>
          {['work','services','about','stack'].map(k=>(
            <a key={k} href={`#${k}`} style={{ fontSize:11,color:'#252530',transition:'color .2s',fontWeight:500,letterSpacing:'.04em' }}
              onMouseEnter={e=>e.currentTarget.style.color='#666'} onMouseLeave={e=>e.currentTarget.style.color='#252530'}>{t.nav[k]}</a>
          ))}
        </div>
      </div>

      {/* Giant name — gradient two-tone yellow */}
      <div style={{ position:'relative', height:'clamp(120px, 18vw, 240px)', overflow:'hidden' }}>
        <div style={{
          position:'absolute', bottom:'-8%', left:'50%', transform:'translateX(-50%)',
          fontSize:'clamp(72px, 12.5vw, 190px)', fontWeight:800, letterSpacing:'-.05em',
          whiteSpace:'nowrap', lineHeight:1,
          background:`linear-gradient(135deg, ${ac} 0%, #c8960a 55%, ${ac}55 100%)`,
          WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent',
          backgroundClip:'text',
          opacity: 0.18,
          userSelect:'none', pointerEvents:'none',
          textAlign:'center',
        }}>CRISTIAN MATEOS</div>
      </div>
    </footer>
  );
}

// ── Tweaks ────────────────────────────────────────────────────────────────────
function AppTweaks({ tweaks, setTweaks }) {
  return (
    <TweaksPanel>
      <TweakSection label="Color" />
      <TweakColor id="accentC" label="Color de acento" value={tweaks.accentC} onChange={v=>setTweaks({accentC:v})} />
      <TweakSection label="Hero" />
      <TweakToggle id="showAvail" label="Badge disponibilidad" value={tweaks.showAvail} onChange={v=>setTweaks({showAvail:v})} />
    </TweaksPanel>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [lang, setLang] = useState('es');
  const [tweaks, setTweaks] = useTweaks(TWEAK_DEFAULTS);
  const t = T[lang];
  const ac = tweaks.accentC;

  useEffect(()=>{ document.documentElement.style.setProperty('--ac',ac); startCursor(); },[]);
  useEffect(()=>{ document.documentElement.style.setProperty('--ac',ac); },[ac]);
  useReveal();

  return (
    <>
      <Nav t={t} lang={lang} setLang={setLang} ac={ac}/>
      <Hero t={t} ac={ac} showAvail={tweaks.showAvail}/>
      <About t={t} ac={ac}/>
      <Projects t={t} ac={ac}/>
      <Services t={t} ac={ac}/>
      <Stack t={t} ac={ac}/>
      <Achievements t={t} ac={ac}/>
      <Contact t={t} ac={ac}/>
      <Footer t={t} ac={ac}/>
      <AppTweaks tweaks={tweaks} setTweaks={setTweaks}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
